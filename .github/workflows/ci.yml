name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # pyproject claims >=3.11. Testing only one version makes that a claim
      # rather than a fact.
      matrix:
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - run: uv sync --frozen

      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy

      # Offline. The vendor call is substituted in tests; everything after it
      # is real, so no network or credentials are needed.
      - run: uv run pytest

  container:
    # The README calls this deployable, which was untrue until this job
    # existed: the image did not build, because pyproject declares a readme
    # the Dockerfile never copied. Nothing caught it, because nothing built it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: docker build -t backtester:ci .

      # Building is not running. This is the command that first exposed a
      # circular import the whole test suite had missed.
      - run: docker run --rm backtester:ci strategies
      - run: docker run --rm backtester:ci run --help
