name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - run: uv sync --frozen

      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy

      # Runs offline. Tests use committed fixtures, never the vendor.
      - run: uv run pytest
