# Shows the deployment shape the design is built for: one store, one writer,
# several readers. MinIO speaks the S3 API, so this needs no AWS account and
# the only thing that changes versus local disk is the dataset root.
#
#   docker compose up
#
# Not required for normal use — `qrt ingest` and `qrt backtest` against a local
# path do the same thing without any of this.

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: qrt
      MINIO_ROOT_PASSWORD: qrtsecret
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  # Runs once, writes the dataset, exits. The only writer.
  ingest:
    build: .
    depends_on:
      minio: {condition: service_healthy}
    environment: &s3
      AWS_ACCESS_KEY_ID: qrt
      AWS_SECRET_ACCESS_KEY: qrtsecret
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_REGION: us-east-1
    command: ["ingest", "--root", "s3://research/us-equities"]

  # Scale with `--scale worker=4`. Workers only read, so they need no
  # coordination between them — that is what append-only buys.
  worker:
    build: .
    depends_on:
      ingest: {condition: service_completed_successfully}
    environment: *s3
    volumes: ["./out:/out"]
    command: ["backtest", "configs/momentum.yaml",
              "--root", "s3://research/us-equities", "--out", "/out"]
